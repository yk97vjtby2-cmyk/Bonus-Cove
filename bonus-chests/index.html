<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Casino Bonus</title>
<style>
  :root {
    --gold:#ffd328;
    --gold-dark:#a76500;
    --bg-a:#07165f;
    --bg-b:#214ac8;
    --text-soft:#e4ebff;
  }

  * { box-sizing:border-box; }

  html, body {
    margin:0;
    min-height:100%;
    font-family:Arial, Helvetica, sans-serif;
    color:#fff;
    background:var(--bg-a);
  }

  body {
    overflow-x:hidden;
  }

  .page {
    min-height:100svh;
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 57%, rgba(70,120,255,.18), transparent 31%),
      repeating-conic-gradient(
        from -90deg at 50% 58%,
        var(--bg-b) 0deg 7deg,
        var(--bg-a) 7deg 14deg
      );
  }

  .page::after {
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse at center, transparent 47%, rgba(0,0,28,.22) 100%);
  }

  .wrap {
    position:relative;
    z-index:2;
    width:min(1180px, 100%);
    min-height:100svh;
    margin:0 auto;
    padding:24px 12px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .brand {
    margin-top:6px;
    font-size:clamp(36px, 5.3vw, 70px);
    line-height:.95;
    font-weight:1000;
    letter-spacing:-2px;
    text-transform:uppercase;
    color:var(--gold);
    text-shadow:
      0 5px 0 var(--gold-dark),
      0 0 18px rgba(255,214,44,.18);
  }

  .pick {
    margin-top:10px;
    font-size:clamp(20px, 2.4vw, 32px);
    line-height:1;
    font-weight:1000;
    text-transform:uppercase;
  }

  .sub {
    margin-top:6px;
    font-size:clamp(13px, 1.5vw, 18px);
    font-weight:700;
    color:var(--text-soft);
  }

  .chest-row {
    width:100%;
    margin:46px auto 10px;
    display:grid;
    grid-template-columns:repeat(3, minmax(0, 1fr));
    justify-items:center;
    align-items:end;
    gap:clamp(14px, 2vw, 28px);
  }

  .chest-btn {
    appearance:none;
    border:0;
    background:transparent;
    padding:0;
    cursor:pointer;
    position:relative;
    width:clamp(165px, 20vw, 240px);
    aspect-ratio:1 / 1;
    min-width:0;
    -webkit-tap-highlight-color:transparent;
    transform-origin:50% 84%;
    transition:
      transform .58s cubic-bezier(.2,.8,.2,1),
      opacity .45s ease,
      filter .45s ease;
  }

  .chest-btn:focus-visible {
    outline:3px solid #fff1a0;
    outline-offset:6px;
    border-radius:16px;
  }

  @media (hover:hover) and (pointer:fine) {
    .chest-btn:hover:not(.selected):not(.dim) {
      transform:translateY(-6px) scale(1.025);
      filter:drop-shadow(0 16px 18px rgba(0,0,0,.34));
    }
  }

  .stage {
    position:absolute;
    inset:0;
  }

  .ground-shadow {
    position:absolute;
    left:11%;
    right:11%;
    bottom:8%;
    height:8%;
    border-radius:50%;
    background:rgba(0,0,0,.34);
    filter:blur(9px);
    transform:scaleX(.9);
    transition:transform .75s ease, opacity .55s ease;
  }

  .closed-img,
  .open-img {
    position:absolute;
    left:0;
    width:100%;
    height:auto;
    pointer-events:none;
    user-select:none;
    will-change:transform, opacity, filter;
  }

  .closed-img {
    bottom:9%;
    opacity:1;
    transform:translateY(0) scale(1);
    filter:drop-shadow(0 12px 10px rgba(0,0,0,.34));
    transition:
      opacity .22s ease .34s,
      transform .80s cubic-bezier(.18,.84,.16,1),
      filter .65s ease;
  }

  .open-img {
    bottom:2%;
    opacity:0;
    transform:translateY(16px) scale(.94);
    filter:drop-shadow(0 12px 10px rgba(0,0,0,.28));
    transition:
      opacity .30s ease .30s,
      transform .92s cubic-bezier(.12,.88,.18,1) .18s,
      filter .75s ease .18s;
  }

  .light {
    position:absolute;
    left:8%;
    right:8%;
    top:18%;
    bottom:7%;
    border-radius:50%;
    pointer-events:none;
    opacity:0;
    transform:scale(.46);
    transition:
      opacity .34s ease .30s,
      transform .90s cubic-bezier(.1,.9,.2,1) .18s;
    background:
      repeating-conic-gradient(
        from 0deg,
        transparent 0deg 8deg,
        rgba(255,228,88,.34) 8.8deg 10deg,
        transparent 11deg 18deg
      );
    mix-blend-mode:screen;
  }

  .light::after {
    content:"";
    position:absolute;
    inset:24%;
    border-radius:50%;
    background:
      radial-gradient(circle,
        rgba(255,255,225,.96) 0 7%,
        rgba(255,235,122,.84) 15%,
        rgba(255,197,28,.45) 38%,
        transparent 74%);
    filter:blur(5px);
  }

  .particles {
    position:absolute;
    inset:0;
    overflow:visible;
    pointer-events:none;
  }

  .particle {
    position:absolute;
    left:50%;
    top:50%;
    width:6px;
    height:6px;
    border-radius:50%;
    opacity:0;
    background:#fff6bb;
    box-shadow:0 0 7px #ffd234, 0 0 14px rgba(255,189,0,.72);
  }

  .chest-btn.preopen {
    animation:anticipate .34s cubic-bezier(.3,.08,.2,1);
  }

  .chest-btn.selected {
    z-index:4;
    transform:translateY(-4px) scale(1.03);
  }

  .chest-btn.selected .closed-img {
    opacity:0;
    transform:translateY(10px) scale(.965);
    filter:drop-shadow(0 7px 7px rgba(0,0,0,.2));
  }

  .chest-btn.selected .open-img {
    opacity:1;
    transform:translateY(-2px) scale(1.02);
    filter:
      drop-shadow(0 15px 11px rgba(0,0,0,.38))
      drop-shadow(0 0 14px rgba(255,196,24,.18));
  }

  .chest-btn.selected .light {
    opacity:1;
    transform:scale(1.12);
  }

  .chest-btn.selected .ground-shadow {
    transform:scaleX(1.04);
    opacity:.72;
  }

  .chest-btn.selected .particle {
    animation:particleFly 1.0s cubic-bezier(.1,.62,.22,1) forwards;
    animation-delay:var(--delay);
  }

  .chest-btn.dim {
    opacity:.28;
    filter:saturate(.72) brightness(.82);
    transform:scale(.93);
  }

  @keyframes anticipate {
    0% { transform:translateY(0) scale(1); }
    54% { transform:translateY(4px) scale(.985,1.015); }
    100% { transform:translateY(-1px) scale(1.01,.99); }
  }

  @keyframes particleFly {
    0% {
      opacity:0;
      transform:translate(-50%,-50%) scale(.35);
    }
    14% {
      opacity:1;
    }
    70% {
      opacity:.85;
    }
    100% {
      opacity:0;
      transform:translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(.08);
    }
  }

  .offer {
    content-visibility:auto;
    contain-intrinsic-size:1px 360px;
    width:min(1000px, 100%);
    max-height:0;
    overflow:hidden;
    opacity:0;
    margin:-10px auto 0;
    transform:translateY(18px) scale(.975);
    transition:
      max-height .85s ease,
      opacity .50s ease,
      transform .72s cubic-bezier(.17,.84,.2,1),
      margin .55s ease;
  }

  .offer.show {
    max-height:520px;
    opacity:1;
    overflow:visible;
    margin-top:-2px;
    transform:translateY(0) scale(1);
  }


  .headline {
    margin:0;
    font-size:clamp(38px, 6.4vw, 84px);
    line-height:.94;
    letter-spacing:-2px;
    font-weight:1000;
    text-transform:uppercase;
    text-shadow:0 5px 0 rgba(0,0,0,.14);
    max-width:900px;
    margin-left:auto;
    margin-right:auto;
  }


  .cta {
    display:inline-flex;
    margin-top:10px;
    justify-content:center;
    align-items:center;
    width:min(650px, 90vw);
    min-height:82px;
    padding:16px 28px;
    border:2px solid #ffe87d;
    border-radius:13px;
    background:linear-gradient(180deg, #ffe247, #ffc522 62%, #eca40c);
    color:#182154;
    text-decoration:none;
    font-size:clamp(29px, 4vw, 48px);
    font-weight:1000;
    text-transform:uppercase;
    box-shadow:
      0 0 28px rgba(255,211,37,.30),
      0 8px 0 rgba(118,69,0,.22),
      inset 0 2px 0 rgba(255,255,255,.55);
    transition:transform .18s ease, filter .18s ease;
  }

  .cta:hover {
    transform:translateY(-2px);
    filter:brightness(1.05);
  }

  .cta:active {
    transform:translateY(1px);
  }

  .fine {
    margin-top:auto;
    padding-top:14px;
    color:rgba(230,238,255,.64);
    font-size:10px;
  }

  @media (max-width: 980px) {
    .wrap {
      padding:22px 10px 18px;
    }

    .chest-row {
      margin-top:52px;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:clamp(10px, 2.4vw, 20px);
      justify-items:center;
      align-items:end;
    }

    .chest-btn {
      width:clamp(140px, 24vw, 210px);
    }

    .chest-btn:nth-child(1) {
      grid-column:1 / span 2;
      width:clamp(170px, 28vw, 225px);
    }
  }

  @media (max-width:700px) {
    .wrap {
      padding:18px 6px 14px;
    }

    .brand {
      font-size:clamp(34px, 10vw, 48px);
    }

    .pick {
      font-size:clamp(18px, 5.2vw, 25px);
    }

    .sub {
      font-size:12px;
    }

    .chest-row {
      margin-top:42px;
      gap:10px 8px;
      grid-template-columns:repeat(2, minmax(0, 1fr));
    }

    .chest-btn {
      width:clamp(104px, 28vw, 138px);
    }

    .chest-btn:nth-child(1) {
      grid-column:1 / span 2;
      width:clamp(128px, 34vw, 156px);
    }

    .headline {
      font-size:clamp(30px, 9.2vw, 54px);
      line-height:.96;
      letter-spacing:-1px;
    }

    .wager {
      font-size:clamp(23px, 7vw, 36px);
    }

    .cta {
      margin-top:8px;
      min-height:68px;
      font-size:clamp(27px, 8vw, 38px);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation:none !important;
      transition:none !important;
      scroll-behavior:auto !important;
    }
  }
</style>
</head>

<script>
(() => {
  const assets = document.getElementById('chestAssets');
  const closedSrc = assets.dataset.closed;
  const openSrc = assets.dataset.open;

  document.querySelectorAll('.closed-img').forEach(img => { img.src = closedSrc; });
  document.querySelectorAll('.open-img').forEach(img => { img.src = openSrc; });

  const buttons = [...document.querySelectorAll('.chest-btn')];
  const offer = document.getElementById('offer');
  const pick = document.getElementById('pick');
  const sub = document.getElementById('sub');
  let used = false;

  function makeParticles(button) {
    const holder = button.querySelector('.particles');
    holder.replaceChildren();

    for (let i = 0; i < 22; i++) {
      const p = document.createElement('span');
      p.className = 'particle';

      const angle = (-164 + Math.random() * 148) * Math.PI / 180;
      const distance = 54 + Math.random() * 112;
      const x = Math.cos(angle) * distance;
      const y = Math.sin(angle) * distance - 18;

      p.style.setProperty('--x', `${x.toFixed(1)}px`);
      p.style.setProperty('--y', `${y.toFixed(1)}px`);
      p.style.setProperty('--delay', `${(320 + Math.random() * 240).toFixed(0)}ms`);

      const size = 3 + Math.random() * 4.5;
      p.style.width = `${size.toFixed(1)}px`;
      p.style.height = `${size.toFixed(1)}px`;

      holder.appendChild(p);
    }
  }

  buttons.forEach(button => {
    button.addEventListener('click', () => {
      if (used) return;
      used = true;

      makeParticles(button);
      button.classList.add('preopen');

      setTimeout(() => {
        button.classList.remove('preopen');

        buttons.forEach(b => {
          b.disabled = true;
          b.classList.toggle('selected', b === button);
          b.classList.toggle('dim', b !== button);
        });
      }, 260);

      pick.textContent = 'Your Bonus';
      sub.textContent = 'You unlocked today’s featured offer';

      setTimeout(() => {
        offer.classList.add('show');
        offer.scrollIntoView({ behavior:'smooth', block:'nearest' });
      }, 1040);
    });
  });

})();
</script>
